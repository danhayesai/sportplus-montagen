name: Deploy to GitHub Pages

# Builds the static site and publishes it to GitHub Pages.
#
# ----------------------------------------------------------------------------
# GOING LIVE ON THE CUSTOM DOMAIN
#
# 1. Point the DNS records at GitHub Pages FIRST (A records for the apex,
#    CNAME for www -> danhayesai.github.io).
# 2. Then set CUSTOM_DOMAIN below to "www.sportplusmontagen.de".
#
# Doing it in that order matters. Setting CUSTOM_DOMAIN while DNS still points
# elsewhere leaves the site unreachable at both addresses: Pages redirects the
# github.io URL to the custom domain, which does not resolve yet.
#
# While CUSTOM_DOMAIN is empty the site is published to the project-site URL
# (https://<owner>.github.io/<repo>/) and the live domain is untouched.
# ----------------------------------------------------------------------------

env:
  CUSTOM_DOMAIN: ''

on:
  push:
    branches: [main]
  # Lets you trigger a deployment by hand from the Actions tab.
  workflow_dispatch:

# Least-privilege token scoped to what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; queue instead of cancelling so a
# half-finished deploy is not left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Astro components
        run: npm run check

      # A project site is served from /<repo>/, a custom domain from the root.
      # Resolving both here keeps the switch to a single edit at the top of
      # this file rather than a scattering of conditionals.
      - name: Resolve deployment target
        id: target
        env:
          REPO: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "site=https://$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
            echo "Publishing to custom domain: https://$CUSTOM_DOMAIN"
          else
            echo "base=/$REPO" >> "$GITHUB_OUTPUT"
            echo "site=https://$OWNER.github.io" >> "$GITHUB_OUTPUT"
            echo "Publishing to project site: https://$OWNER.github.io/$REPO/"
          fi

      - name: Build site
        run: npm run build
        env:
          PAGES_BASE: ${{ steps.target.outputs.base }}
          PAGES_SITE: ${{ steps.target.outputs.site }}

      # Pages reads CNAME from the published artifact. It is written only for a
      # custom-domain deploy: shipping it while DNS still points elsewhere would
      # make Pages redirect the working github.io URL to a domain that does not
      # resolve, taking the site offline at both addresses.
      - name: Write CNAME for the custom domain
        if: env.CUSTOM_DOMAIN != ''
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME

      # enablement:true means the workflow turns Pages on itself rather than
      # failing with "Get Pages site failed" when it has never been enabled.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
