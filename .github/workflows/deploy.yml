name: Deploy to GitHub Pages

# Builds the static site and publishes it to GitHub Pages.
#
# This does NOT affect the current live site on its own. It publishes to the
# repository's github.io address until the domain's DNS records are pointed at
# GitHub Pages, which is a separate, deliberate step.
#
# Before the first run, enable Pages in the repository:
#   Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"

on:
  push:
    branches: [main]
  # Lets you trigger a deployment by hand from the Actions tab.
  workflow_dispatch:

# Least-privilege token scoped to what Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; queue instead of cancelling so a
# half-finished deploy is not left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check Astro components
        run: npm run check

      # No PAGES_BASE / PAGES_SITE: the site is served from the root of its
      # custom domain, so it builds with the defaults in astro.config.mjs.
      # (Those variables are still supported if it ever needs to go back to a
      # /<repo>/ project-site URL.)
      - name: Build site
        run: npm run build

      # enablement:true means the workflow turns Pages on itself rather than
      # failing with "Get Pages site failed" when it has never been enabled.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
